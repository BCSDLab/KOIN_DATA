version: 2

models:
  - name: silver_events
    description: >
      GA4 확정 일별 Export를 이벤트 grain으로 정제한 Silver 증분 테이블.
      raw_event_id 물리 중복 제거와 event_id 논리 중복 제거를 UNNEST 전에 수행하고,
      공통 이벤트 파라미터·KST 시간·화면명·Android 가입 세션을 표준화한다.
    config:
      tags: ["airflow_daily"]
    columns:
      - name: raw_event_id
        description: 전송·배치 위치, user_pseudo_id, canonical event_params로 생성한 원천 물리 행의 SHA256 식별자
        data_tests:
          - not_null
          - unique

      - name: event_id
        description: 사용자·시각·이벤트 내용으로 생성하고 논리 중복을 제거한 Silver PK
        data_tests:
          - not_null
          - unique

      - name: event_dt
        description: Asia/Seoul 기준 이벤트 날짜이자 테이블 파티션 키
        data_tests:
          - not_null

      - name: event_at
        description: Asia/Seoul 기준 이벤트 현지 일시(DATETIME)
        data_tests:
          - not_null

      - name: event_ts
        description: GA4 event_timestamp 원본 마이크로초 값(INT64)
        data_tests:
          - not_null

      - name: event_name
        description: GA4 이벤트 이름
        data_tests:
          - not_null

      - name: user_pseudo_id
        description: GA4 가명 사용자 식별자. 동의 거부로 발생하는 정상 NULL을 허용한다.

      - name: ga_session_id
        description: event_params에서 추출한 GA4 세션 식별자

      - name: custom_session_id
        description: 원본 값을 우선하고 Android 회원가입 이벤트는 최근 시작 ID 상속 또는 15분 생성 규칙으로 보정한 세션 식별자

      - name: platform
        description: 이벤트 발생 플랫폼(WEB, ANDROID, IOS 등)
        data_tests:
          - not_null

      - name: device_category
        description: GA4 device.category
        data_tests:
          - not_null

      - name: device_os
        description: GA4 device.operating_system. 정상 NULL을 허용하며 별도로 모니터링한다.

      - name: device_os_version
        description: GA4 device.operating_system_version

      - name: event_label
        description: event_params의 event_label

      - name: event_category
        description: event_params의 event_category

      - name: event_value
        description: event_params의 value를 STRING으로 표준화한 값

      - name: page_title
        description: event_params의 page_title

      - name: screen_class
        description: screen_name 우선순위와 Activity 이름 보정을 적용한 화면 클래스

      - name: engagement_time_msec
        description: event_params의 engagement_time_msec를 INT64로 안전 변환한 값

      - name: page_location
        description: event_params의 page_location URL

  - name: silver_events_v2
    description: >
      GA4 확정 일별 Export를 이벤트 grain으로 정제한 Silver 증분 테이블.
      raw_event_id 물리 중복 제거와 event_id 논리 중복 제거를 UNNEST 전에 수행하고,
      공통 이벤트 파라미터·KST 시간·화면명·Android 가입 세션을 표준화한다.
    config:
      tags: ["airflow_daily", "airflow_monthly", "initial_load_required"]
    columns:
      - name: event_id
        description: 사용자·시각·이벤트 내용으로 생성하고 논리 중복을 제거한 Silver PK
        data_tests:
          - not_null
          - unique

      - name: event_dt
        description: Asia/Seoul 기준 이벤트 날짜이자 테이블 파티션 키
        data_tests:
          - not_null
      - name: event_at
        description: Asia/Seoul 기준 이벤트 현지 일시(DATETIME)
        data_tests:
          - not_null

      - name: event_ts
        description: GA4 event_timestamp 원본 마이크로초 값(INT64)
        data_tests:
          - not_null

      - name: event_name
        description: GA4 이벤트 이름
        data_tests:
          - not_null

      - name: user_pseudo_id
        description: GA4 가명 사용자 식별자. 동의 거부로 발생하는 정상 NULL을 허용한다.

      - name: ga_session_id
        description: event_params에서 추출한 GA4 세션 식별자

      - name: custom_session_id
        description: 원본 값을 우선하고 Android 회원가입 이벤트는 15분 규칙으로 보정한 세션 식별자

      - name: platform
        description: 이벤트 발생 플랫폼(WEB, ANDROID, IOS 등)
        data_tests:
          - not_null

      - name: device_category
        description: GA4 device.category
        data_tests:
          - not_null

      - name: device_os
        description: GA4 device.operating_system. 정상 NULL을 허용하며 별도로 모니터링한다.

      - name: device_os_version
        description: GA4 device.operating_system_version

      - name: event_label
        description: event_params의 event_label

      - name: event_category
        description: event_params의 event_category

      - name: event_value
        description: event_params의 value를 STRING으로 표준화한 값

      - name: page_title
        description: event_params의 page_title

      - name: screen_class
        description: screen_name 우선순위와 Activity 이름 보정을 적용한 화면 클래스

      - name: engagement_time_msec
        description: event_params의 engagement_time_msec를 INT64로 안전 변환한 값

      - name: page_location
        description: event_params의 page_location URL
      - name: service_name
        description: 정규화된 이벤트 속성으로 분류한 KOIN 서비스명입니다.
        data_tests:
          - not_null
      - name: funnel_stage
        description: >
          서비스와 이벤트 속성으로 분류한 퍼널 단계명입니다.
          main 서비스는 main이며, 분류 규칙에 해당하지 않는 이벤트는 NULL입니다.
      - name: step_order
        description: >
          서비스별 퍼널 단계에 부여한 논리적 순서입니다. 실제 이벤트 발생 순서가 아닙니다.
          main 단계는 0, 나머지 정의된 단계는 1~5이며, 매핑되지 않은 단계는 NULL입니다.
      - name: is_entry_event
        description: >
          funnel_stage가 entry이면 TRUE, 그 외 분류된 단계이면 FALSE입니다.
          funnel_stage가 NULL이면 NULL이며, signup_start나 login_entry는 TRUE에 포함되지 않습니다.
      - name: is_core_action
        description: >
          서비스별 핵심 행동(게시글 읽기, 상점 전화, 식단 공유, 버스 검색,
          동아리 상세 조회, 배너 클릭, 시간표 저장, 회원가입 완료)이면 TRUE입니다.
          그 외 분류된 단계는 FALSE이며, funnel_stage가 NULL이면 NULL입니다.
      - name: stage_scope
        description: main 이벤트는 global, 그 외 서비스 이벤트는 service입니다.
        data_tests:
          - not_null
      - name: service_step_order
        description: >
          서비스 내부 퍼널 분석용 단계 순서입니다. main 서비스는 NULL이고,
          그 외 서비스는 step_order를 그대로 사용하므로 매핑되지 않은 단계도 NULL입니다.

  - name: silver__users
    description: >
      Prod GA4 원천과 KOIN 회원 정보를 결합하는 운영 전환 후보 사용자
      Dimension이다. 로컬 Airflow 검증에서는 Stage silver 데이터셋에만 적재한다.
    config:
      tags: ["airflow_daily", "airflow_monthly", "initial_load_required"]
    columns:
      - name: user_pseudo_id
        description: GA4 사용자 인스턴스 식별자이자 모델의 논리 PK
        data_tests:
          - not_null
          - unique
      - name: first_seen_at
        description: 사용자 상태 산정에 포함된 첫 관측 시각(KST)
        data_tests:
          - not_null
      - name: last_seen_at
        description: 사용자 상태 산정에 포함된 마지막 관측 시각(KST)
        data_tests:
          - not_null
      - name: user_type
        description: koin_users의 회원 유형
      - name: signup_completed_at
        description: koin_users.created_at 기반 회원가입 완료 시각
      - name: is_deleted
        description: koin_users.is_deleted의 정수화 값
      - name: is_mysql_mapped
        description: 선정된 user_id가 koin_users에 매핑됐는지 여부
        data_tests:
          - not_null
