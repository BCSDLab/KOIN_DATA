koin:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('KOIN_DATA_GCP_PROJECT') }}"
      dataset: "{{ env_var('KOIN_DATA_STAGING_DATASET', 'staging') }}"
      location: "{{ env_var('KOIN_DATA_BIGQUERY_LOCATION', 'asia-northeast3') }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '/secrets/gcp-service-account.json') }}"
      threads: 4
      timeout_seconds: 300
      priority: interactive
      retries: 1
