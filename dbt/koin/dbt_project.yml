name: koin
version: 1.0.0
config-version: 2

profile: koin

model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  koin:
    staging:
      +materialized: view
      +schema: "{{ env_var('KOIN_DATA_STAGING_DATASET', 'staging') }}"
    bronze:
      +materialized: table
      +schema: "{{ env_var('KOIN_DATA_BRONZE_DATASET', 'bronze') }}"
    silver:
      +materialized: table
      +schema: "{{ env_var('KOIN_DATA_SILVER_DATASET', 'silver') }}"
    marts:
      +materialized: table
      +schema: "{{ env_var('KOIN_DATA_GOLD_DATASET', 'gold') }}"
